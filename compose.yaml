name: fitness
x-api-env: &api-env
  DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness_local}@postgres:5432/fitness
  API_PORT: 4000
  WEB_URL: ${WEB_URL:-http://localhost:3000}
  NODE_ENV: production
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_FROM: ${SMTP_FROM:-club@fitness.local}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  PAYMENT_PROVIDER: simulator
  OUTBOX_SECRET: ${OUTBOX_SECRET:?Set OUTBOX_SECRET in .env}
  UPLOADS_DIR: /app/uploads
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
services:
  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_local}
      POSTGRES_DB: fitness
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.31.1
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  migrate:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    environment: *api-env
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    environment: *api-env
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:4000:4000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker.js"]
    environment: *api-env
    volumes: ["uploads:/app/uploads"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_URL: http://api:4000
        SITE_URL: ${WEB_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      SITE_URL: ${WEB_URL:-http://localhost:3000}
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
  edge:
    profiles: ["edge"]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
