name: fitness
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_local}
      POSTGRES_DB: fitness
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  api:
    profiles: ["app"]
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    environment:
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness_local}@postgres:5432/fitness
      API_PORT: 4000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      NODE_ENV: production
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PAYMENT_PROVIDER: simulator
      OUTBOX_SECRET: ${OUTBOX_SECRET:?Set OUTBOX_SECRET in .env}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:4000:4000"]
  worker:
    profiles: ["app"]
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    command: ["node", "apps/api/dist/worker.js"]
    environment:
      OUTBOX_SECRET: ${OUTBOX_SECRET:?Set OUTBOX_SECRET in .env}
      DATABASE_URL: postgresql://fitness:${POSTGRES_PASSWORD:-fitness_local}@postgres:5432/fitness
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      NODE_ENV: production
      OUTBOX_SECRET: ${OUTBOX_SECRET:?Set OUTBOX_SECRET in .env}
    depends_on:
      postgres: {condition: service_healthy}
  web:
    # Browser requests stay on the web origin through the Next API proxy.
    profiles: ["app"]
    build: {context: ., dockerfile: infra/docker/web.Dockerfile}
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
