name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env: { POSTGRES_USER: fitness, POSTGRES_PASSWORD: fitness_local, POSTGRES_DB: fitness }
        ports: ['54329:5432']
        options: --health-cmd "pg_isready -U fitness -d fitness" --health-interval 5s --health-retries 10
    env:
      OUTBOX_SECRET: ci-only-encryption-key-not-for-deployment-12345
      DATABASE_URL: postgresql://fitness:fitness_local@localhost:54329/fitness
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.8.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
